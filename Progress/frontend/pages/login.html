<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | ComicID</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="login">
    <div id="app">
        <main class="auth-page">
            <button
                type="button"
                class="theme-toggle"
                id="theme-toggle"
                aria-label="Ganti tema"
                title="Ganti tema"
            >
                <span class="theme-icon">☀</span>
            </button>

            <section class="auth-card">
                <a class="brand auth-brand" href="home.html">
                    <span class="brand-icon">C</span>
                    <span>Comic<span class="brand-accent">ID</span></span>
                </a>

                <p class="section-eyebrow">SELAMAT DATANG KEMBALI</p>
                <h1>Masuk ke akunmu</h1>
                <p class="auth-description">
                    Masuk dan lanjutkan membaca komik favoritmu.
                </p>

                <form id="login-form" class="auth-form" novalidate>
                    <label for="login-email">Email atau Username</label>
                    <input
                        id="login-email"
                        name="email"
                        type="text"
                        placeholder="nama@email.com atau username"
                        autocomplete="username"
                        required
                    >

                    <label for="login-password">Password</label>
                    <input
                        id="login-password"
                        name="password"
                        type="password"
                        placeholder="Masukkan password"
                        autocomplete="current-password"
                        required
                    >

                    <p
                        id="login-message"
                        class="auth-message"
                        role="alert"
                        hidden
                    ></p>

                    <button
                        type="submit"
                        class="signup-button auth-submit"
                    >
                        Masuk
                    </button>
                </form>

                <p class="auth-switch">
                    Belum punya akun?
                    <a href="register.html">Daftar</a>
                </p>
            </section>
        </main>
    </div>

    <!-- Script Utama (ES Module jika dibuka lewat web server) -->
    <script type="module" src="../js/app.js"></script>

    <!-- Script Mandiri (Fallback jika dibuka via file:/// tanpa web server) -->
    <script>
        (function() {
            function initFallbackLogin() {
                const form = document.getElementById("login-form");
                const message = document.getElementById("login-message");
                if (!form || form.dataset.attached === "true") return;
                form.dataset.attached = "true";

                // Setup theme toggle sederhana
                const themeBtn = document.getElementById("theme-toggle");
                const currentTheme = localStorage.getItem("wc_theme") || "dark";
                document.documentElement.setAttribute("data-theme", currentTheme);
                if (themeBtn) {
                    const icon = themeBtn.querySelector(".theme-icon");
                    if (icon) icon.textContent = currentTheme === "light" ? "☀" : "☾";
                    themeBtn.addEventListener("click", () => {
                        const newTheme = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
                        document.documentElement.setAttribute("data-theme", newTheme);
                        localStorage.setItem("wc_theme", newTheme);
                        if (icon) icon.textContent = newTheme === "light" ? "☀" : "☾";
                    });
                }

                form.addEventListener("submit", async (event) => {
                    event.preventDefault();
                    const email = document.getElementById("login-email").value.trim();
                    const password = document.getElementById("login-password").value;
                    const submitBtn = form.querySelector("button[type='submit']");

                    function showMessage(text, isError = true) {
                        message.textContent = text;
                        message.hidden = false;
                        message.style.color = isError ? "var(--color-danger, #ef4444)" : "var(--color-success, #22c55e)";
                    }

                    message.hidden = true;

                    if (!email && !password) {
                        showMessage("Form login wajib diisi.");
                        return;
                    }
                    if (!email) {
                        showMessage("Email atau username wajib diisi.");
                        return;
                    }
                    if (email.includes("@")) {
                        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                            showMessage("Format email tidak valid.");
                            return;
                        }
                    } else if (email.length < 3) {
                        showMessage("Username minimal 3 karakter.");
                        return;
                    }
                    if (!password) {
                        showMessage("Password wajib diisi.");
                        return;
                    }
                    if (password.length < 8) {
                        showMessage("Password minimal 8 karakter.");
                        return;
                    }

                    try {
                        if (submitBtn) {
                            submitBtn.disabled = true;
                            submitBtn.textContent = "Memverifikasi...";
                        }

                        const response = await fetch("http://localhost:8080/api/login", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ email, password })
                        });

                        const result = await response.json();

                        if (!response.ok || !result.success) {
                            showMessage(result.message || "Gagal masuk ke akun.");
                            return;
                        }

                        localStorage.setItem("comicid_logged_in_email", result.email);
                        localStorage.setItem("comicid_logged_in", "true");
                        localStorage.setItem("comicid_logged_in_role", result.role);
                        localStorage.setItem("comicid_username_" + result.email, result.username);

                        showMessage("Login berhasil! Mengalihkan ke beranda...", false);
                        setTimeout(() => {
                            window.location.href = "home.html";
                        }, 800);
                    } catch (error) {
                        showMessage("Gagal terhubung ke backend (http://localhost:8080). Pastikan run-backend.bat sudah aktif.");
                    } finally {
                        if (submitBtn) {
                            submitBtn.disabled = false;
                            submitBtn.textContent = "Masuk";
                        }
                    }
                });
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", initFallbackLogin);
            } else {
                initFallbackLogin();
            }
        })();
    </script>
</body>
</html>
