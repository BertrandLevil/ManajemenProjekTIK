<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Responsive modern login and signup card UI" />
  <title>Login / Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="space-theme">
  <!-- Dynamic Space Canvas: Rapid Shooting Stars & Twinkling Cosmos -->
  <canvas id="spaceCanvas" class="space-canvas"></canvas>

  <main class="auth-container phone-frame">
    <div class="hero-image" role="img" aria-label="Decorative header image">
      <div class="hero-overlay-tag">🌌 COMIC-ID</div>
    </div>

    <section class="auth-card" aria-label="Account access">
      <div class="tabs" role="tablist" aria-label="Choose login or sign up">
        <button class="tab" id="loginTab" type="button" role="tab" aria-selected="false">Log In</button>
        <button class="tab active" id="signupTab" type="button" role="tab" aria-selected="true">Sign Up</button>
      </div>

      <form id="authForm">
        <label class="visually-hidden" for="identity">Email or username</label>
        <input id="identity" name="identity" type="text" placeholder="Enter email or username" autocomplete="username" required />

        <label class="visually-hidden" for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required />

        <button class="submit-button" id="submitButton" type="submit">Sign Up</button>
      </form>

      <div class="or-divider">OR</div>

      <div class="social-buttons" aria-label="Social sign in">
        <button class="social facebook" type="button" aria-label="Continue with Facebook">
          <span aria-hidden="true">f</span>
        </button>
        <button class="social google" type="button" aria-label="Continue with Google">
          <span class="google-g" aria-hidden="true">G</span>
        </button>
        <button class="social x-social" type="button" aria-label="Continue with X">
          <span aria-hidden="true">𝕏</span>
        </button>
      </div>
      <p class="message" id="message" aria-live="polite"></p>
      <div style="text-align: center; margin-top: 16px;">
        <a href="pages/home.html" class="guest-link">
          Explore Comics as Guest →
        </a>
      </div>
    </section>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
